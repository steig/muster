name: release

# scripts/build.sh falls back to
# releases/latest/download/herdr-wt_<os>_<arch> when the installing machine has
# no Go toolchain. That URL only resolves if a release actually carries those
# assets under exactly those names, so this workflow is what makes installing
# without Go work at all.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        # Pure Go with no cgo, so every target cross-compiles from one runner.
        # CGO_ENABLED=0 keeps that true rather than accidental.
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            os="${target%_*}"
            arch="${target#*_}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/herdr-wt_${target}" .
          done
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/herdr-wt_windows_amd64.exe .

      - name: checksums
        run: cd dist && sha256sum herdr-wt_* > checksums.txt && cat checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env rather than inline interpolation: a tag name is attacker
          # controlled in the general case, and this is a shell.
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "$TAG"
