# herdr-wt — git worktrees as herdr workspaces.
#
# Install with `herdr plugin install steig/herdr-wt`, or for local development
# `herdr plugin link .` from a checkout.

id = "steig.wt"
name = "herdr-wt"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Drive git worktrees as herdr workspaces: list, create, and tear down worktrees with their workspace and agent state in one view."
platforms = ["linux", "macos", "windows"]

# Build the binary at install time. herdr runs this once, after the install is
# confirmed and before the plugin is registered.
#
# Unix: the script prefers a local Go toolchain and falls back to downloading a
# prebuilt release binary, so installing works with or without Go.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

# Windows has no POSIX `sh`, so build straight from source. Installing on
# Windows therefore needs Go on PATH.
[[build]]
platforms = ["windows"]
command = ["go", "build", "-o", "bin/herdr-wt.exe", "."]

# Every entry point is declared twice — a unix entry and a windows twin — because
# herdr requires a unique id per action and the two platforms need different
# commands. The windows command goes through powershell rather than invoking
# .\bin\herdr-wt.exe directly: herdr sets the child's cwd to the plugin root, but
# CreateProcessW resolves a relative application path against herdr's own cwd, so
# the bare relative path fails. powershell's `&` resolves it from the right place.

# ls — list every worktree in the current repository with the herdr workspace and
# agent status attached. Output lands in `herdr plugin log list --plugin steig.wt`.
[[actions]]
id = "ls"
title = "wt: list worktrees"
platforms = ["linux", "macos"]
command = ["./bin/herdr-wt", "ls"]

[[actions]]
id = "ls-windows"
title = "wt: list worktrees"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\herdr-wt.exe ls"]

# sync — adopt every worktree herdr has no workspace for, and staff every
# workspace sitting there as a bare shell. Both are non-destructive, so they act
# directly. Finished worktrees are only LISTED: a plugin action has no prompt
# surface, so there is no confirmation step and pruning never happens here.
[[actions]]
id = "sync"
title = "wt: sync worktrees"
platforms = ["linux", "macos"]
command = ["./bin/herdr-wt", "sync"]

[[actions]]
id = "sync-windows"
title = "wt: sync worktrees"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\herdr-wt.exe sync"]

# prune — the safe half: reports which worktrees look finished and why, and
# which were spared and why, without touching anything. This is the action to
# reach for; prune-apply below is the deliberate second step.
[[actions]]
id = "prune"
title = "wt: prune (list)"
platforms = ["linux", "macos"]
command = ["./bin/herdr-wt", "prune"]

[[actions]]
id = "prune-windows"
title = "wt: prune (list)"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\herdr-wt.exe prune"]

# prune-apply — the destructive twin of `prune`, kept as its own action so that
# removing worktrees is always a deliberate choice and never something a stray
# keybinding can reach. Guards are re-checked at execution time, so anything
# that gained uncommitted work or an agent since the plan is skipped and said so.
[[actions]]
id = "prune-apply"
title = "wt: prune (apply)"
platforms = ["linux", "macos"]
command = ["./bin/herdr-wt", "prune-apply"]

[[actions]]
id = "prune-apply-windows"
title = "wt: prune (apply)"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\herdr-wt.exe prune-apply"]
